name: Build openGym AI Coach

on:
  schedule:
    - cron: '0 3 * * *' # Baut jede Nacht um 3:00 Uhr
  workflow_dispatch: # Erlaubt manuelles Starten per Klick

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Original openGym Repository
        uses: actions/checkout@v4
        with:
          repository: 'duartesantos8/opengym'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Coach
        uses: docker/build-push-action@v5
        with:
          context: ./api
          target: coach
          push: true
          tags: ghcr.io/dein-github-name/opengym-api-coach:latest
