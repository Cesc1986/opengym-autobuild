name: Build openGym AI Coach

on:
  schedule:
    - cron: '0 3 * * *' # Baut jede Nacht um 3:00 Uhr
  workflow_dispatch: # Erlaubt manuelles Starten per Klick

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout Original openGym Repository
        uses: actions/checkout@v4
        with:
          repository: 'duartesantos8/opengym'

      - name: Get latest release version from original repo
        id: get_version
        run: |
          LATEST_TAG=$(curl -sL https://api.github.com/repos/duartesantos8/opengym/releases/latest | jq -r '.tag_name')
          echo "VERSION=$LATEST_TAG" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Coach
        uses: docker/build-push-action@v5
        with:
          context: ./api
          target: coach
          push: true
          tags: |
            ghcr.io/cesc1986/opengym-autobuild:latest
            ghcr.io/cesc1986/opengym-autobuild:${{ env.VERSION }}
